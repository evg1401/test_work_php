name: test-php-app

services:
  mysql:
    image: mysql:8.4
    env_file:
      - ./test_work_php/configs/.env
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 3

  composer:
    image: composer:2
    working_dir: /app
    volumes:
      - ./test_work_php:/app
    command:
      - composer
      - install
      - --no-interaction
      - --prefer-dist

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./test_work_php/configs/.env
    working_dir: /var/www/html
    depends_on:
      composer:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    volumes:
      - ./test_work_php:/var/www/html
    ports:
      - "8080:8080"
    command:
      - php
      - -S
      - 0.0.0.0:8080
      - -t
      - public

volumes:
  mysql_data:

